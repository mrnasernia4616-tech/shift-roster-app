
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

            - name: Extract project ZIP
        run: |
          mkdir -p extracted/project
          unzip -o shift_roster_cloud_build.zip -d extracted
          find extracted -name '*.zip' -exec unzip -o {} -d extracted/project \;
        
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build APK
        run: |
          cd extracted/project
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShiftRoster-debug-apk
          path: extracted/project/app/build/outputs/apk/debug/app-debug.apk
